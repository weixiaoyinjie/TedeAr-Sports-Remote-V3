
name: Build TedeAr Sports Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -n "$ZIP" ]; then
            unzip -qo "$ZIP" -d .
          fi
          test -f app/build.gradle

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TedeAr-Sports-Remote-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
