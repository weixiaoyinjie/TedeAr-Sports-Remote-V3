
name: Build TedeAr Sports Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 35
        run: |
          command -v sdkmanager
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle ]; then
            ZIP=$(find . -maxdepth 1 -type f -iname '*TedeAr*zip' -print -quit)
            if [ -z "$ZIP" ]; then
              echo 'Source ZIP not found'
              exit 1
            fi
            unzip -qo "$ZIP" -d .
          fi
          test -f app/build.gradle
          test -f settings.gradle

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TedeAr-Sports-Remote-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
