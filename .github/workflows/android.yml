
name: Build TedeAr Sports Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack source ZIP
        run: |
          if [ ! -f app/build.gradle ]; then
            archive=$(find . -maxdepth 1 -type f -iname '*TedeAr*zip' | head -n 1)
            if [ -z "$archive" ]; then
              echo 'Missing source ZIP'
              exit 1
            fi
            unzip -qo "$archive" -d .
          fi
          test -f app/build.gradle

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TedeAr-Sports-Remote-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
